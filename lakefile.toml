# Lake configuration. M-F permits foundation prototypes before M1 (D-FD-01).
# Mathlib is pinned to the release tag matching lean-toolchain (D-CH-24).
# Bumping the pin is a deliberate act: update both files together and refresh the
# Mathlib inventory node (AT-KR-0, D-KR-02) in the same PR.
name = "CategoryMadness"
defaultTargets = ["Kernel", "Root", "Interface", "Theory", "Prototype", "Foundations", "Augmented"]

[leanOptions]
autoImplicit = false          # D-TL-06 (6): universe test
relaxedAutoImplicit = false

# Initial dependency inventory and minimal universe contracts (AT-KR-0, AT-FD-1).
[[lean_lib]]
name = "Foundations"
roots = ["Foundations"]

# Incident generators and rows for the augmented shape gate (D-KR-18, AT-FD-7).
[[lean_lib]]
name = "Augmented"
roots = ["Augmented"]

# M-F experiments are checked without exporting a sealed interface (D-FD-01).
[[lean_lib]]
name = "Prototype"
roots = ["Prototype"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

# Stage 0 (D-CH-08): scaffolding on Mathlib. Hidden after the seal.
[[lean_lib]]
name = "Kernel"

# Stage 1: the VDC∞ definition and constructions. Hidden after the seal.
[[lean_lib]]
name = "Root"

# The seal (D-RT-13): the only thing Theory/ may see.
[[lean_lib]]
name = "Interface"

# Stage 2: everything else, in interface terms only (D-CH-09).
[[lean_lib]]
name = "Theory"

# Interface-Stub/ is not a library target: the swap test (D-TL-06 (4)) swaps it into
# place of Interface/ and rebuilds Theory — see scripts/swap_test.sh.
