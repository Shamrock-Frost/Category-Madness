# M-F foundation slice (D-CH-21, D-CH-24, D-RT-28, AT-FD-2).
# Mathlib is pinned to the release tag matching lean-toolchain.
# Bumping the pin is a deliberate act: update both files together and refresh the
# Mathlib inventory node (AT-KR-0, D-KR-14) in the same PR.
name = "CategoryMadness"
defaultTargets = ["Kernel", "Interface", "Theory", "Foundation"]

[leanOptions]
autoImplicit = false          # D-TL-17: explicit universes
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

# Stage 0 (D-CH-21): scaffolding. Hidden after the seal.
[[lean_lib]]
name = "Kernel"

# Stage 1: the VDC∞ definition and constructions. Hidden after the seal.
[[lean_lib]]
name = "Root"

# The seal (D-RT-28): the only thing Theory/ may see.
[[lean_lib]]
name = "Interface"

# Stage 2: clients in interface terms only (D-CH-22).
[[lean_lib]]
name = "Theory"

# Only positive experiments are library targets. Negative fixtures are never imported.
[[lean_lib]]
name = "Foundation"
roots = ["Prototype.Universes"]

[[lean_lib]]
name = "Audit"
roots = ["Prototype.Audit"]

# Interface-Stub/ supplies replacement modules in an isolated swap-test checkout.
