# CI — the seal linter and forest checks (D-TL-06, D-WF-02). All jobs are blocking.
#
# At M0 the Lean directories are empty, so the seal jobs run against empty directories
# and pass (D-TL-06 is frozen at M0; the *mechanism* exists before any mathematics does).
# The Lean build itself is gated on the presence of Lean sources.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  seal:
    name: seal linter (import ban, unfolding ban, statement hygiene)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 scripts/check_imports.py           # D-TL-06 (1)
      - run: python3 scripts/check_unfolding.py         # D-TL-06 (2), syntax level
      - run: python3 scripts/check_statement_hygiene.py # D-TL-06 (3)

  forest:
    name: forest (references, registry, decision fields)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 scripts/forest_check.py            # D-WF-02, D-WF-03
      - name: MCP smoke test
        run: python3 mcp/server.py --selftest            # D-WF-05

  citations:
    # D-WF-04 (3): a PR must cite the decision nodes it relies on.
    name: PR cites decisions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: check citations in PR title and body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | python3 scripts/check_citations.py -

  lean:
    # D-TL-06 (4)–(6): build, swap test, universe test. Skipped while there is no Lean.
    name: lake build + swap test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: sources
        run: |
          if find Kernel Root Interface Theory -name '*.lean' | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "no Lean sources yet (M0); skipping build"
          fi
      - if: steps.sources.outputs.present == 'true'
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build: true
      - if: steps.sources.outputs.present == 'true'
        run: bash scripts/swap_test.sh
